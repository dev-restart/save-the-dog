<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Save The Dog</title>
  <desc id="desc">Voxel game logo for Save The Dog.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#2f1d0e" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#172554" flood-opacity="0.35"/>
    </filter>
    <pattern id="pixels" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#facc15"/>
      <rect width="9" height="9" fill="#fde047" opacity="0.75"/>
      <rect x="9" y="9" width="9" height="9" fill="#ca8a04" opacity="0.38"/>
    </pattern>
  </defs>
  <g filter="url(#shadow)">
    <rect x="34" y="210" width="456" height="48" fill="#2f7d2f" stroke="#1f4d1f" stroke-width="8"/>
    <rect x="34" y="246" width="456" height="30" fill="#7c4a22" stroke="#4a2a12" stroke-width="8"/>
    <text x="24" y="94" font-family="Arial Black, Inter, sans-serif" font-size="66" font-weight="900" letter-spacing="0" fill="url(#pixels)" stroke="#3f250e" stroke-width="8" paint-order="stroke">SAVE THE</text>
    <text x="26" y="172" font-family="Arial Black, Inter, sans-serif" font-size="88" font-weight="900" fill="url(#pixels)" stroke="#3f250e" stroke-width="9" paint-order="stroke">DOG</text>
    <text x="38" y="226" font-family="Arial Black, Inter, sans-serif" font-size="34" font-weight="900" textLength="430" lengthAdjust="spacingAndGlyphs" fill="#e5f9ff" stroke="#0f172a" stroke-width="6" paint-order="stroke">DRAW BLOCK SURVIVE</text>
    <g transform="translate(354 88) scale(0.86)">
      <rect x="0" y="16" width="72" height="54" fill="#facc15" stroke="#4a2a12" stroke-width="6"/>
      <rect x="10" y="4" width="52" height="16" fill="#fde047" stroke="#4a2a12" stroke-width="6"/>
      <rect x="30" y="42" width="16" height="18" fill="#2f1d0e"/>
    </g>
  </g>
</svg>
