    <text x="34" y="226" font-family="Arial Black, Inter, sans-serif" font-size="34" font-weight="900" textLength="430" lengthAdjust="spacingAndGlyphs" fill="url(#blue)" stroke="#0f172a" stroke-width="6" paint-order="stroke">DRAW BLOCK SURVIVE</text>
    <g transform="translate(344 88) scale(0.86)">
