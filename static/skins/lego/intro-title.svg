    <text x="24" y="94" font-family="Arial Black, Inter, sans-serif" font-size="66" font-weight="900" letter-spacing="1" fill="url(#plastic)" stroke="#7c2d12" stroke-width="8" paint-order="stroke">SAVE THE</text>
    <text x="26" y="172" font-family="Arial Black, Inter, sans-serif" font-size="88" font-weight="900" letter-spacing="1" fill="url(#plastic)" stroke="#7c2d12" stroke-width="9" paint-order="stroke">DOG</text>
    <text x="38" y="226" font-family="Arial Black, Inter, sans-serif" font-size="34" font-weight="900" textLength="430" lengthAdjust="spacingAndGlyphs" fill="#ffffff" stroke="#111827" stroke-width="6" paint-order="stroke">DRAW BLOCK SURVIVE</text>
    <g transform="translate(354 88) scale(0.86)">
