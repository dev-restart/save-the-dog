<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Save The Dog</title>
  <desc id="desc">Plastic brick toy logo for Save The Dog.</desc>
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffef68"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="7" flood-color="#111827" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="36" y="220" width="448" height="48" rx="12" fill="#16a34a" stroke="#0f6d2c" stroke-width="7"/>
    <g fill="#2f8f45">
      <circle cx="76" cy="220" r="12"/>
      <circle cx="138" cy="220" r="12"/>
      <circle cx="200" cy="220" r="12"/>
      <circle cx="262" cy="220" r="12"/>
      <circle cx="324" cy="220" r="12"/>
      <circle cx="386" cy="220" r="12"/>
